<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quadern de Camp Digital - NLASL">
    <title>Quadern de Camp - NLASL</title>

    <link rel="icon" type="image/png" href="/logo-nlasl.png">
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <!-- ============================================ -->
    <!-- PANTALLA LOGIN -->
    <!-- ============================================ -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <img src="/logo-nlasl.png" alt="NLASL" class="login-logo">
                <h1>🌾 Quadern de Camp</h1>
                <p>NLASL - Nadal Lavernia Agrícola SL</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="login-email">Email:</label>
                    <input type="email" id="login-email" required placeholder="usuari@nlasl.temp">
                </div>
                
                <div class="form-group">
                    <label for="login-password">Contrasenya:</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="login-remember">
                        Recordar-me
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    🔐 Entrar
                </button>
                
                <div id="login-error" class="alert alert-error" style="display: none; margin-top: 15px;"></div>
            </form>
        </div>
    </div>
    
    <!-- ============================================ -->
    <!-- APLICACIÓ PRINCIPAL -->
    <!-- ============================================ -->
    <div id="app-screen" style="display: none;">
        <header class="app-header">
            <div class="header-left">
                <img src="/logo-nlasl.png" alt="NLASL" class="header-logo">
                <h1>🌾 Quadern de Camp - NLASL</h1>
            </div>
            <div class="header-right">
                <span id="user-info" class="user-badge"></span>
                <button onclick="tancarSessio()" class="btn btn-secondary btn-sm">🚪 Sortir</button>
            </div>
        </header>
        
        <nav class="main-nav">
    <button class="nav-btn active" onclick="canviarVista('dashboard')" data-view="dashboard">🏠 Inici</button>
    
    <div class="nav-group">
        <button class="nav-btn nav-group-btn" onclick="toggleSubmenu('operacions')">🌱 Operacions ▾</button>
        <div id="submenu-operacions" class="submenu" style="display:none;">
            <button class="nav-btn submenu-btn" onclick="canviarVista('tractaments');tancarSubmenus();" data-view="tractaments">🌱 Tractaments</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('fertilitzacions');tancarSubmenus();" data-view="fertilitzacions">🌾 Fertilitzacions</button>
        </div>
    </div>

    <button class="nav-btn" onclick="canviarVista('control-horari')" data-view="control-horari">⏱️ Control Horari</button>

    <div class="nav-group">
        <button class="nav-btn nav-group-btn" onclick="toggleSubmenu('avisos')">🔔 Avisos ▾</button>
        <div id="submenu-avisos" class="submenu" style="display:none;">
            <button class="nav-btn submenu-btn" onclick="canviarVista('incidencies');tancarSubmenus();" data-view="incidencies">⚠️ Incidències</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('absencies');tancarSubmenus();" data-view="absencies">📅 Absències</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('alertes');tancarSubmenus();" data-view="alertes">🔔 Alertes</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn nav-group-btn" onclick="toggleSubmenu('consums')">📦 Consums ▾</button>
        <div id="submenu-consums" class="submenu" style="display:none;">
            <button class="nav-btn submenu-btn" onclick="canviarVista('collita');tancarSubmenus();" data-view="collita">🍎 Collita</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('reg');tancarSubmenus();" data-view="reg">💧 Reg</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('gasoil');tancarSubmenus();" data-view="gasoil">⛽ Gasoil</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('compres');tancarSubmenus();" data-view="compres">🛒 Compres</button>
			<button class="nav-btn submenu-btn" onclick="canviarVista('existencies');tancarSubmenus();" data-view="existencies">📦 Existències</button>
        </div>
    </div>

    <div class="nav-group">
        <button class="nav-btn nav-group-btn" onclick="toggleSubmenu('gestio')">⚙️ Gestió ▾</button>
        <div id="submenu-gestio" class="submenu" style="display:none;">
            <button class="nav-btn submenu-btn" onclick="canviarVista('treballadors');tancarSubmenus();" data-view="treballadors">👥 Treballadors</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('productes');tancarSubmenus();" data-view="productes">📦 Productes</button>
            <button class="nav-btn submenu-btn" onclick="canviarVista('parcelles');tancarSubmenus();" data-view="parcelles">🗺️ Parcel·les</button>
			<button class="nav-btn submenu-btn" onclick="canviarVista('informes');tancarSubmenus();" data-view="informes">📊 Informes</button>
        </div>
    </div>
</nav>
        
        <main class="main-content">
            <div id="view-container"></div>
        </main>
        
        <div id="notificacions"></div>
        <div id="sync-indicator" class="sync-indicator">
            <span id="sync-status">🔄 Sincronitzant...</span>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
	

    <!-- Els teus scripts -->
		<script src="/supabase-client.v5.js"></script>
		<script>
    // Verificar que tot s'ha carregat
		console.log('📍 getUserProfile exists?', typeof getUserProfile !== 'undefined');
		console.log('📍 supabaseClient exists?', typeof supabaseClient !== 'undefined');
		</script>
		<script src="/auth.v3.js"></script>
		<script src="/app_v8.js"></script>
		<script src="/collita.v1.js"></script>
		<script src="/collita-ui.v1.js"></script>
		<script src="/horari-extensions.v1.js"></script>
		<script src="/admin-panel.v1.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
		<script src="/veu.v1.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
		
    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(reg => console.log('✅ Service Worker registrat'))
                    .catch(err => console.log('❌ Service Worker error:', err));
            });
        }
    </script>
	<script>
    // Event listener login
    document.getElementById('login-form').addEventListener('submit', login);
</script>
<script src="/existencies.v1.js"></script>
</body>
</html>
